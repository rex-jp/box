<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>inbox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0c;--surface:#161616;--border:#252525;--border2:#333;
  --text:#f0ebe0;--muted:#6b6560;--accent:#e8b45a;
  --green:#5cc8a0;--red:#e06060;--r:10px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Noto Sans JP",sans-serif;font-weight:300;line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:2.5rem 1.25rem;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center}
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:1.75rem}
h1{font-size:1.05rem;font-weight:500;margin-bottom:.35rem}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:1.5rem}
.field{margin-bottom:1rem}
.field-label{display:block;font-size:.65rem;text-transform:uppercase;
  letter-spacing:.12em;color:var(--muted);margin-bottom:.4rem}
input[type=text],input[type=password]{width:100%;background:var(--bg);
  border:1px solid var(--border2);border-radius:6px;color:var(--text);
  font-size:.95rem;padding:.7rem .8rem;outline:none;transition:border-color .2s;
  font-family:ui-monospace,monospace;letter-spacing:.08em}
#code{font-size:1.35rem;text-align:center;letter-spacing:.22em;padding:.85rem .8rem}
input:focus{border-color:var(--accent)}
.btn{width:100%;border:none;border-radius:var(--r);cursor:pointer;
  background:var(--accent);color:#0c0c0c;font-weight:500;font-size:.9rem;
  padding:.75rem 1.1rem;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border2);
  margin-top:.5rem;font-size:.78rem;padding:.5rem}
.drop{border:1px dashed var(--border2);border-radius:var(--r);padding:1.6rem 1rem;
  text-align:center;color:var(--muted);font-size:.82rem;cursor:pointer;
  transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:#1c1a16;color:var(--text)}
.drop.has{border-style:solid;border-color:var(--green);color:var(--text)}
.drop b{display:block;font-weight:500;font-size:.9rem;word-break:break-all}
.drop small{color:var(--muted)}
.status{margin-top:1rem;font-size:.82rem;min-height:1.4em}
.status.err{color:var(--red)}
.status.ok{color:var(--green)}
.ticket{font-family:ui-monospace,monospace;color:var(--accent);letter-spacing:.12em}
.note{margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border);
  font-size:.72rem;color:var(--muted)}
.hidden{display:none}
#step1{display:flex;flex-direction:column;gap:.9rem}
#step1 .bell{margin-top:0;order:-1;letter-spacing:.18em;text-transform:lowercase}
.done{display:flex;align-items:center;justify-content:center;min-height:100vh;
  color:var(--muted);font-size:.9rem;letter-spacing:.08em;text-align:center;padding:2rem;
  line-height:2}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title" class="hidden">預ける</h1>
    <div class="sub hidden" id="subtitle"></div>

    <!-- 一段目: telg と 番号枠 だけ -->
    <div id="step1">
      <button class="btn ghost bell" id="telg">telg</button>
      <input id="code" type="text" autocomplete="off" spellcheck="false"
             inputmode="latin" maxlength="10" placeholder="0000-aaaaa">
      <button class="btn" id="next">次へ</button>
    </div>

    <!-- 二段目: 同じ画面のままファイルとパス -->
    <div id="step2" class="hidden">
      <div class="field">
        <label class="field-label">ファイル</label>
        <div class="drop" id="drop">
          ここにドラッグ&ドロップ<br><small>またはクリックして選ぶ</small>
        </div>
        <input id="file" type="file" class="hidden">
      </div>
      <div class="field">
        <label class="field-label" for="pass">パス</label>
        <input id="pass" type="password" autocomplete="off" placeholder="このPCに置いてあるもの">
      </div>
      <button class="btn" id="go">送る</button>
      <button class="btn ghost" id="back">番号を入れ直す</button>
    </div>

    <div class="status" id="status"></div>

  </div>
</div>

<script>
const DB = "https://gio-brain-default-rtdb.asia-southeast1.firebasedatabase.app";
const ITER  = 310000;              // 母艦 box.ITER と一致させること
const CHUNK = 6 * 1024 * 1024;     // 母艦 box.CHUNK と一致させること
const MAX   = 40 * 1024 * 1024;    // 母艦 box.MAX_BYTES と一致させること
// 母艦 inbox.py の FIXED_D / FIXED_L と一致させること(ズレたら全部弾かれる)。
// ★これは秘密ではない: この行は誰でも読める。目的は「見ずに次へを押せない」ことと
//   打ち間違いの早期検知であって、本当の関所はFirebaseルールと固定パス。
const FIXED_D = "8";               // 前から2番目(数字)
const FIXED_L = "w";               // 前から8番目(英字の後ろから2番目)
const $ = id => document.getElementById(id);
let CODE = null, PICKED = null;

function say(msg, kind) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}

function humanSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

function b64e(buf) {
  const b = new Uint8Array(buf);
  let s = "";
  const STEP = 0x8000;                        // 一度に渡すと大きい片で落ちる
  for (let i = 0; i < b.length; i += STEP) {
    s += String.fromCharCode.apply(null, b.subarray(i, i + STEP));
  }
  return btoa(s);
}

// 番号の正規化。母艦 inbox.normalize と同じ形(数字4+英字5・ハイフンは飾り)。
function normalize(text) {
  const s = String(text || "").replace(/[\s\-_]/g, "").toLowerCase();
  if (!/^[0-9]{4}[a-z]{5}$/.test(s)) return null;
  if (s[1] !== FIXED_D || s[7] !== FIXED_L) return null;   // 2番目と8番目
  return s;
}

// 打っている途中でハイフンを自動で入れる(写し間違いを減らす)
$("code").addEventListener("input", e => {
  let v = e.target.value.replace(/[\s\-_]/g, "").toLowerCase().slice(0, 9);
  e.target.value = v.length > 4 ? v.slice(0, 4) + "-" + v.slice(4) : v;
  say("");
});

// リンクの #番号 を拾う(サーバには送られない断片)
const hash = location.hash.replace(/^#/, "").trim();
if (hash) {
  $("code").value = hash.length === 9 ? hash.slice(0, 4) + "-" + hash.slice(4) : hash;
}

function toStep2() {
  const c = normalize($("code").value);
  if (!c) { say("受付番号が違います。", "err"); return; }
  // ★形と固定位置しか見ていない。番号が実在するかは【この画面からは確かめられない】
  //   (店を読めないのが設計。当たり外れを外から測れないようにしてある)
  //   どこが違うかは言わない(言えば当てる手掛かりになる)
  CODE = c;
  $("step1").classList.add("hidden");
  $("step2").classList.remove("hidden");
  $("title").classList.remove("hidden");
  $("subtitle").classList.remove("hidden");
  $("title").textContent = "預ける";
  $("subtitle").innerHTML = '受付番号 <span class="ticket">' + $("code").value
                          + '</span> のファイルを選んでください。';
  say("");
  $("pass").focus();
}

function toStep1() {
  CODE = null; PICKED = null;
  $("file").value = ""; $("pass").value = "";
  $("drop").className = "drop";
  $("drop").innerHTML = "ここにドラッグ&ドロップ<br><small>またはクリックして選ぶ</small>";
  $("step2").classList.add("hidden");
  $("step1").classList.remove("hidden");
  $("title").classList.add("hidden");
  $("subtitle").classList.add("hidden");
  say("");
  $("code").focus();
}

function pick(f) {
  if (!f) return;
  if (f.size > MAX) { say("大きすぎます（上限 " + (MAX/1024/1024) + "MB）。", "err"); return; }
  PICKED = f;
  $("drop").className = "drop has";
  $("drop").innerHTML = "<b>" + f.name + "</b><small>" + humanSize(f.size) + "</small>";
  say("");
}

// ドラッグ&ドロップ(今開いている画面にそのまま落とせる)
const drop = $("drop");
["dragenter","dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => pick(e.dataTransfer.files[0]));
drop.addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => pick(e.target.files[0]));
// 画面のどこに落としてもブラウザが勝手に開かないようにする
["dragover","drop"].forEach(ev =>
  window.addEventListener(ev, e => { if (e.target !== drop) e.preventDefault(); }));

// 呼び鈴。店には「押された」以上の意味を書かない(誰が押したかは残さない)。
// 母艦が1分ごとに拾い、受付番号をGioのTelegramへ配る。
// ★同時に1件しか書けない(ルール: 既に在れば拒否)=押し続けても鳴るのは1回。
async function ring() {
  $("telg").disabled = true;
  const prev = $("telg").textContent;
  $("telg").textContent = "…";
  try {
    const res = await fetch(`${DB}/invite_request.json`,
      { method: "PUT", cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ at: Date.now() }) });
    $("telg").textContent = res.ok ? "sent" : prev;
    if (!res.ok) say("いま呼べません。", "err");
  } catch (e) {
    $("telg").textContent = prev;
    say("いま呼べません。", "err");
  }
  setTimeout(() => { $("telg").disabled = false; $("telg").textContent = prev; }, 60000);
}

async function send() {
  const pass = $("pass").value;
  if (!CODE)   { say("受付番号がありません。", "err"); return; }
  if (!PICKED) { say("ファイルを選んでください。", "err"); return; }
  if (!pass)   { say("パスを入れてください。", "err"); return; }

  $("go").disabled = true; $("back").disabled = true;
  say("読み込んでいます…");

  let row;
  try {
    // 原本はメモリで読むだけ。新しいファイルをディスクに書かない。
    const data = new Uint8Array(await PICKED.arrayBuffer());
    const head = new TextEncoder().encode(
      JSON.stringify({ name: PICKED.name,
                       mime: PICKED.type || "application/octet-stream",
                       size: data.length }));
    const body = new Uint8Array(head.length + 1 + data.length);
    body.set(head, 0); body[head.length] = 10; body.set(data, head.length + 1);

    say("鍵を作っています…");
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);

    const n = Math.max(1, Math.ceil(body.length / CHUNK));
    row = { v: 2, alg: "PBKDF2-SHA256/AES-GCM", iter: ITER, parts: n,
            salt: b64e(salt), status: "filled" };
    for (let i = 0; i < n; i++) {
      say(`暗号にしています… ${i + 1}/${n}`);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      // 通し番号をAADに混ぜる = 並べ替え・抜き取りは母艦の復号で落ちる
      const aad = new TextEncoder().encode(String(i));
      const ct = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv, additionalData: aad }, key,
        body.subarray(i * CHUNK, (i + 1) * CHUNK));
      const packed = new Uint8Array(12 + ct.byteLength);
      packed.set(iv, 0); packed.set(new Uint8Array(ct), 12);
      row["c" + i] = b64e(packed);
    }
  } catch (e) {
    say("暗号にできませんでした（" + e.message + "）。", "err");
    $("go").disabled = false; $("back").disabled = false; return;
  }

  say("送っています…");
  let res;
  try {
    res = await fetch(`${DB}/inbox/${encodeURIComponent(CODE)}.json`,
      { method: "PATCH", cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(row) });
  } catch (e) {
    say("送れませんでした（回線）。", "err");
    $("go").disabled = false; $("back").disabled = false; return;
  }

  // ★受け付けられない理由(番号違い/期限切れ/使用済み)は区別しない。
  //   区別できると、番号の当たり外れを外から測れてしまう。
  if (!res.ok) {
    say("この受付番号では送れません。番号と期限を確かめてください。", "err");
    $("go").disabled = false; $("back").disabled = false; return;
  }

  // 送った後は手元から消す(閉じる前でも残さない)
  $("pass").value = ""; $("file").value = ""; row = null; PICKED = null; CODE = null;
  document.body.innerHTML =
    '<div class="done">送りました。<br>この画面を閉じてください。<br>'
  + '<small>届いたかどうかは、送り主の側にだけ通知されます。</small></div>';
}

$("telg").addEventListener("click", ring);
$("next").addEventListener("click", toStep2);
$("back").addEventListener("click", toStep1);
$("go").addEventListener("click", send);
$("code").addEventListener("keydown", e => { if (e.key === "Enter") toStep2(); });
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

if (!crypto.subtle) {
  say("この画面は https でないと開けません。", "err");
  $("next").disabled = true;
}
$("code").focus();
</script>
</body>
</html>
